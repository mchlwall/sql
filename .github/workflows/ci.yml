name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck project-manager/scripts/*.sh

  sqlfluff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so new sqlfluff rules don't fail CI without a code change
      - run: pipx run sqlfluff==4.5.0 lint project-manager/queries --dialect sqlite

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - run: ./project-manager/scripts/smoke.sh
